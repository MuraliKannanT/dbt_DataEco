models:
  - name: stg_nations
    description: Table which stores Nation Data
    columns:
      - name: nation_id
        description: '{{ doc("primary_key") }}'
        tests:
          - unique:
              config:
                store_failures: true
          - not_null
      - name: region_id
        data_type: number(10)
        tests:
          - not_null
          - relationships:
              to: ref('stg_regions')
              field: region_id
      - name: name  
        tests:
          - dbt_utils.not_accepted_values:
              arguments:
                values: ['CAMBODIA']
  - name: stg_regions
    description: Regional Information
    columns:
      - name: region_id
        description: '{{ doc("primary_key") }}'
        tests:
          - unique
      - name: name
        tests:
          - accepted_values:
               values: ['ASIA','AFRICA','AMERICA','EUROPE','AUSTRALIA','MIDDLE EAST']


